<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Carrito — Star Park</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../Página principal/style.css">
    <link rel="stylesheet" href="carrito.css">
</head>
<body>

    <header>
        <nav>
            <a href="../Página principal/index01.html"><img src="../img/logostar.png" alt="Star Park Logo"></a>
            <ul>
                <li><a href="../Página principal/index01.html">Inicio</a></li>
                <li><a href="../Página principal/index01.html#servicios">Tienda</a></li>
            </ul>
            <a class="botonAmarillo btn btn-warning" href="../Página principal/index01.html#servicios">Seguir comprando</a>
        </nav>
    </header>

    <main>
        <div class="seccionCabecera">
            <h2>TU CARRITO</h2>
            <p class="etiquetaGris">Revisa tu selección y completa tu reserva</p>
        </div>


        <div class="layoutCarrito">
            <div class="glass bloqueCarrito">
                <h3>Servicios seleccionados</h3>
                <div id="listaCarrito"></div>
                <div class="totalFila">
                    <p>TOTAL</p>
                    <p class="amarillo" id="totalPrecio">S/ 0.00</p>
                </div>
            </div>


            <div class="glass bloqueCarrito">
                <h3>Datos para la reserva</h3>
                <form id="formularioCarrito">
                    <div class="campo">
                        <label class="form-label" for="nombre">Nombre completo</label>
                        <input class="form-control" type="text" id="nombre" placeholder="Nombres" required>
                    </div>
                    <div class="campo">
                        <label class="form-label" for="correo">Correo</label>
                        <input class="form-control" type="email" id="correo" placeholder="abc@gmail.com" required>
                    </div>
                    <div class="campo">
                        <label class="form-label" for="telefono">Teléfono</label>
                        <input class="form-control" type="tel" id="telefono" placeholder="999 999 999" required>
                    </div>
                    <div class="campo">
                        <label class="form-label" for="fecha">Fecha de visita</label>
                        <input class="form-control" type="date" id="fecha" required>
                    </div>
                    <button type="submit" class="botonAmarillo btn btn-warning">Confirmar reserva</button>
                </form>
            </div>
        </div>
    </main>


    <footer>
        <div class="footerInterior">
            <div>
                <p class="footerNombre">STAR PARK</p>
                <p class="etiquetaGris">©2026 FAMILY PARK S.A.C.</p>
            </div>
        </div>
    </footer>


    <script src="carrito.js"></script>


</body>
</html>
