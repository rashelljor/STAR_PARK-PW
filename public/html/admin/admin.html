<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Configuración básica del documento. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión — Star Park</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50%' y='50%' text-anchor='middle' dominant-baseline='central' font-size='80'>🔑</text></svg>"/>
    <!-- Bootstrap y estilos generales del proyecto. -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../assets/css/global.css">
    <link rel="stylesheet" href="../assets/css/componentes.css">
    <link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body>
    <main>
        <div class="text-center text-white p-5">
            <h1>INICIA SESIÓN EN <br><em class="celeste">STAR</em> <em>PARK</em></h1><br>
            <p class="etiqueta">Panel Administrativo</p>
        </div>

        <section id="loginForm">
            <div class="bloqueFormulario glass">
                <form id="formLogin" novalidate>
                    <div class="campo">
                        <label class="form-label celeste" for="usuario">Nombre de usuario o dirección de correo electrónico</label>
                        <input class="form-control" type="text" id="usuario" name="usuario" autocomplete="username" placeholder="abc@example.com" required>
                        <p class="mensajeError" id="errorUsuario" role="alert"></p>
                    </div>

                    <div class="campo">
                        <label class="form-label celeste" for="contrasena">Contraseña</label>
                        <input class="form-control" type="password" id="contrasena" name="contrasena" autocomplete="current-password" placeholder="123ABCdef" required>
                        <p class="mensajeError" id="errorContrasena" role="alert"></p>
                    </div>

                    <p class="mensajeError" id="errorGeneral" role="alert"></p>
                    <div class="d-flex justify-content-center">
                        <button type="submit" class="btn btn-primary rounded-pill botonAmarillo botonAncho">Iniciar sesión</button>
                    </div>
                    
                </form>
            </div>
        </section>
    </main>

    <!-- Bootstrap se carga antes del código propio de la página. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <!-- auth.js maneja la validación e inicio de sesión de este formulario. -->
    <script src="../js/controller/auth.js"></script>
</body>
</html>
